services:
  story-stack:
    build: .
    container_name: story-stack
    restart: unless-stopped
    ports:
      - "4100:4100"
    environment:
      PORT: "4100"
      HOST: "0.0.0.0"
      STORY_STACK_DATA_DIR: "/data"
      STORY_STACK_LIBRARY_PATH: "/srv/media/audiobooks/"
      STORY_STACK_ADMIN_EMAIL: "${STORY_STACK_ADMIN_EMAIL:-}"
      STORY_STACK_ADMIN_PASSWORD: "${STORY_STACK_ADMIN_PASSWORD:-}"
      STORY_STACK_USER_PASSWORD: "${STORY_STACK_USER_PASSWORD:-}"
      STORY_STACK_PUBLIC_URL: "${STORY_STACK_PUBLIC_URL:-}"
    volumes:
      - /srv/story-stack/data:/data
      - ${STORY_STACK_HOST_LIBRARY_PATH:-./media/audiobooks}:/srv/media/audiobooks/:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: story-stack-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - story-stack
